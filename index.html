<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创造与魔法 · 贝雅大陆全能助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101d;color:#edf6ff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
:root{--c:#66d9ff;--g:#62e4a1;--card:#101d2e;--line:#23364e;--muted:#91a5bd}
header{padding:16px 12px;background:linear-gradient(135deg,#0c2943,#091522);border-bottom:1px solid var(--line)}
.wrap{max-width:1250px;margin:auto}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);margin-top:6px;font-size:13px}
.search{display:flex;gap:8px;margin-top:12px}
.search input{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:#06101b;color:#fff;font-size:14px}
.btn{border:0;border-radius:11px;padding:0 14px;background:var(--c);font-weight:800;cursor:pointer;color:#06111c;font-size:14px}
nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#cbd9e9;cursor:pointer;font-size:13px}
.tab.on{background:#17405a;color:white;border-color:#56c8ef}
main{padding:14px 12px}
.title{font-size:19px;font-weight:800;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#13243a,#0d1929);border:1px solid var(--line);border-radius:15px;padding:14px}
.tag{font-size:12px;color:#83e3ff}
.big{font-size:18px;font-weight:850;margin:6px 0}
.muted{color:var(--muted);font-size:13px;line-height:1.65;white-space:pre-line}
.row{display:flex;gap:8px;flex-wrap:wrap}
.select,.input{background:#071321;border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:14px}
.result{font-size:16px;color:var(--g);font-weight:800;margin-top:12px}
.note{padding:12px;border-radius:10px;background:#182637;color:#b5c5d8;font-size:12px;margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{color:#bfeeff}
footer{text-align:center;color:#667a91;padding:20px;font-size:12px}
.map-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.map-toolbar select,.map-toolbar input{background:#0c1726;border:1px solid var(--line);color:#e8f0fa;border-radius:8px;padding:9px 10px;font-size:13px}
.map-toolbar input{flex:1;min-width:120px}
.map-toolbar select{min-width:110px}
.map-container{position:relative;width:100%;aspect-ratio:16/10;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(circle at 30% 40%,#1b4962,#102a3e 32%,#0b1828 70%);margin-bottom:14px}
.mpoint{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;cursor:pointer;border:2px solid #fff;transition:.2s;z-index:2}
.mpoint:hover{transform:translate(-50%,-50%) scale(1.25);z-index:10}
.mpoint.p-plant{background:#66e3a4;color:#062}
.mpoint.p-box{background:#ffcf5c;color:#111}
.mpoint.p-mineral{background:#ff8a65;color:#111}
.mpoint.p-boss{background:#e040fb;color:#fff}
.mpoint.p-rare{background:#4fc3f7;color:#061}
.mpoint.p-sky{background:#b388ff;color:#111}
.mpoint.p-underground{background:#8d6e63;color:#fff}
.mpoint.p-special{background:#ffb74d;color:#111}
.mpoint.p-mount{background:#4dd0e1;color:#111}
.popup{position:absolute;background:#111c2e;border:1px solid #2e4a6a;border-radius:10px;padding:10px 12px;font-size:12px;color:#c9d8e9;z-index:20;min-width:170px;max-width:240px;pointer-events:none;opacity:0;transition:.15s;white-space:normal;line-height:1.7}
.popup.show{opacity:1}
.popup .pn{font-weight:800;color:#7ee0ff;margin-bottom:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.info-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);line-height:1.9}
.info-panel b{color:#c9d8e9}
.alg-stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.alg-stat{text-align:center;min-width:60px}
.alg-stat .n{font-size:18px;font-weight:800;color:#7ee0ff}
.alg-stat .l{font-size:10px;color:#7a8fa8}
.grid9{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.layer-label{font-size:11px;color:#5a7a9a;margin:6px 0 2px;grid-column:1/-1;border-bottom:1px solid #1e3048;padding-bottom:2px}
.totem{background:#0c1726;border:2px solid var(--line);border-radius:12px;padding:8px 6px;cursor:pointer;transition:.2s;text-align:center}
.totem.lit{border-color:#4fc3f7;background:#0e2a3f;box-shadow:0 0 10px rgba(79,195,247,.25)}
.totem.gold{border-color:#ffd54f;background:#2a2210;box-shadow:0 0 12px rgba(255,213,79,.35)}
.totem .name{font-size:11px;font-weight:700;color:#c9d8e9}
.totem .layer{font-size:9px;color:#5a7a9a;margin-top:1px}
.totem .dots{display:flex;gap:4px;justify-content:center;margin-top:5px}
.totem .dot{width:9px;height:9px;border-radius:50%;background:#1e3048;transition:.15s}
.totem .dot.on{background:#4fc3f7}
.totem.gold .dot.on{background:#ffd54f}
.alg-result{background:#0c1726;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px}
.alg-result .rl{font-size:12px;color:#7a8fa8;margin-bottom:4px}
.alg-result .rn{font-size:22px;font-weight:800;margin-bottom:4px}
.alg-result .rd{font-size:12px;color:#8aa8c4}
.r-putong{color:#9e9e9e}.r-xiyou{color:#4fc3f7}.r-jiechu{color:#81c784}
.r-dashi{color:#ffb74d}.r-qiji{color:#e040fb}.r-fail{color:#555}
.reward-box{background:#13243a;border:1px solid #2e4a6a;border-radius:10px;padding:12px;margin-bottom:12px}
.reward-box .rt{font-size:11px;color:#7a8fa8;margin-bottom:6px}
.reward-box .rv{font-size:14px;font-weight:700;color:#62e4a1}
.reward-box .rn2{font-size:11px;color:#8aa8c4;margin-top:4px;line-height:1.6}
.alg-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.alg-btns .btn{flex:1;min-width:90px;padding:10px;font-size:13px}
.btn-s{background:#1e3048;color:#c9d8e9}
.btn-g{background:#ffd54f;color:#111}
.btn:disabled{opacity:.4;cursor:not-allowed}
.alg-log{max-height:160px;overflow-y:auto;font-size:12px;color:#7a8fa8;line-height:1.8}
.alg-log-item{padding:4px 0;border-bottom:1px solid #111c2e}
.table-wrap{overflow-x:auto}
.progress-bar{width:100%;height:8px;background:#1e3048;border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,#4fc3f7,#e040fb);border-radius:4px;transition:width .3s}
.timer-card{background:#13243a;border:1px solid #2e4a6a;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.timer-card .info{flex:1;min-width:150px}
.timer-card .name{font-size:13px;font-weight:700;color:#c9d8e9}
.timer-card .loc{font-size:11px;color:#7a8fa8}
.timer-card .countdown{font-size:16px;font-weight:800;color:#62e4a1;min-width:80px;text-align:center}
.timer-card .countdown.warn{color:#ffb74d}
.timer-card .countdown.done{color:#e040fb;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.timer-card .actions{display:flex;gap:4px}
.timer-card .actions button{padding:4px 8px;border:0;border-radius:6px;font-size:11px;cursor:pointer}
.btn-start-timer{background:#4fc3f7;color:#06111c}
.btn-reset-timer{background:#1e3048;color:#c9d8e9}

.map-real::before {
  content: '';
  display: block;
  padding-top: 97%;
}
.map-point {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 900;
  cursor: pointer;
  border: 2px solid #fff;
  transition: transform .15s;
  z-index: 3;
  box-shadow: 0 2px 8px rgba(0,0,0,.6);
}
.map-point:hover {
  transform: translate(-50%, -50%) scale(1.5);
  z-index: 10;
}
.map-point.boss { background: #e040fb; color: #fff; }
.map-point.mount { background: #4dd0e1; color: #061; }
.map-point.plant { background: #66e3a4; color: #062; }
.map-point.mineral { background: #ff8a65; color: #111; }
.map-point.box { background: #ffcf5c; color: #111; }
.map-point.sky { background: #b388ff; color: #111; }
.map-point.underground { background: #8d6e63; color: #fff; }
.map-point.special { background: #ffb74d; color: #111; }
.map-point.rare { background: #4fc3f7; color: #061; }
.map-popup {

/* ========== 刷新计时 ========== */
let timerIntervals={};
function renderTimerPage(){
 let timerCards = refreshTimers.map((t,i)=>{
   let hours=parseFloat(t[2])||0;
   let minutes=Math.round(hours*60);
   if(t[2].includes('分钟'))minutes=parseInt(t[2]);
   if(t[2].includes('天'))minutes=parseFloat(t[2])*24*60;
   if(t[2].includes('每周'))minutes=7*24*60;
   if(minutes<=0||isNaN(minutes))minutes=60;
   return `<div class="timer-card" id="tc-${i}">
     <div class="info">
       <div class="name">${t[0]} · ${t[1]}</div>
       <div class="loc">${t[3]} · 刷新周期：${t[2]}</div>
     </div>
     <div class="countdown" id="cd-${i}">--:--:--</div>
     <div class="actions">
       <button class="btn-start-timer" onclick="startIndependentTimer(${i},${minutes})">开始</button>
       <button class="btn-reset-timer" onclick="resetIndependentTimer(${i})">重置</button>
     </div>
   </div>`;
 }).join("");
 app.innerHTML=`<div class=title>⏱ 刷新计时（每条独立）</div>
 <div class=panel>
   <p class=muted style="margin-bottom:12px">每条计时器独立运行，可以同时追踪北境骨龙和霸王龙等多个刷新点。点击「开始」启动倒计时，到时间后闪烁提醒。</p>
   ${timerCards}
 </div>
 <div class=note>刷新时间可能上下波动5-15分钟。部分资源因服务器而异，数据仅供参考。计时器从点击「开始」时刻起算。</div>`;
}
function startIndependentTimer(index,minutes){
 if(timerIntervals[index])clearInterval(timerIntervals[index]);
 let endTime=Date.now()+minutes*60*1000;
 let el=document.getElementById('cd-'+index);
 if(!el)return;
 timerIntervals[index]=setInterval(()=>{
   let left=Math.max(0,endTime-Date.now());
   let h=Math.floor(left/3600000);
   let m=Math.floor(left%3600000/60000);
   let s=Math.floor(left%60000/1000);
   el.textContent=left?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:'已刷新！';
   el.className='countdown'+(left?'':' done');
   if(!left){clearInterval(timerIntervals[index]);delete timerIntervals[index];}
 },250);
}
function resetIndependentTimer(index){
 if(timerIntervals[index]){clearInterval(timerIntervals[index]);delete timerIntervals[index];}
 let el=document.getElementById('cd-'+index);
 if(el){el.textContent='--:--:--';el.className='countdown';}
}

function showRealPopup(p,btn){

 const noteHtml=p.note?`<div class="note">💡 ${p.note}</div>`:'';
 popupEl.innerHTML=`<div class="pn">${p.name}</div>
 <div class="pmeta">
   <span class="ptag" style="background:${tc}22;color:${tc};border:1px solid ${tc}">${typeNames[p.type]||p.type}</span>
   <span class="ptag" style="background:#1e3048;color:#7ee0ff">${p.space}</span>
 </div>
 <div class="pos">📍 ${p.pos}</div>
 <div class="coords">🔢 ${p.coords}</div>
 <div>⏱ <span class="refresh">${p.refresh}</span></div>
 ${dropsHtml}
 ${noteHtml}`;
 // 计算弹窗位置，避免超出边界
 let left = r.left - m.left + 15;
 let top = r.top - m.top - 10;
 const popupWidth = 280;
 const popupHeight = 180;
 if(left + popupWidth > m.width) left = r.left - m.left - popupWidth - 15;
 if(top + popupHeight > m.height) top = m.height - popupHeight - 10;
 if(top < 5) top = 5;
 popupEl.style.left = left + 'px';
 popupEl.style.top = top + 'px';
 popupEl.classList.add('show');
}

function algToggle(id){
 if(!algState[id].lit){algState[id].lit=true;algState[id].count=1;}
 else if(algState[id].count>=3){algState[id].lit=false;algState[id].count=0;}
 else algState[id].count++;
 algRender();algUpdateStats();
}
function algRender(){
 const grid=document.getElementById('alg-grid');if(!grid)return;
 const gens={1:[],2:[],3:[]};
 ALG_TOTEMS.forEach(t=>gens[t.gen].push(t));
 let html='';
 [1,2,3].forEach(gen=>{
   const label=gen===1?'一代 · 父辈':gen===2?'二代':'三代 · 子辈';
   html+=`<div class="layer-label">${label}</div>`;
   gens[gen].forEach(t=>{
     const s=algState[t.id]||{lit:false,count:0};
     const litClass=s.lit?' lit':'';
     const goldClass=(t.gen===1&&s.lit&&s.count>=3)?' gold':'';
     const dots=[1,2,3].map(i=>`<div class="dot${i<=s.count?' on':''}"></div>`).join('');
     html+=`<div class="totem${litClass}${goldClass}" onclick="algToggle('${t.id}')">
       <div class="name">${t.name}</div><div class="layer">G${t.gen}</div>
       <div class="dots">${dots}</div></div>`;
   });
 });
 grid.innerHTML=html;
 algEvaluate();
}
function algEvaluate(){
 let truths=0;
 ALG_TOTEMS.forEach(t=>{
   if(algState[t.id].lit&&algState[t.id].count>=3){truths++;algLog(`✨ 真理：${t.name}（三律全亮）`);}
 });
 let normalRules=0,goldRules=0;
 for(const [parentId,childIds] of Object.entries(PARENT_CHILD)){
   const p=algState[parentId];
   if(!p||!p.lit)continue;
   const litChildren=childIds.filter(cid=>algState[cid]&&algState[cid].lit);
   if(litChildren.length>=2){
     for(let i=0;i<litChildren.length;i++){
       for(let j=i+1;j<litChildren.length;j++){
         const parentGen=ALG_TOTEMS.find(t=>t.id===parentId).gen;
         if(parentGen===1){
           goldRules++;
           algLog(`🌟 黄金法则：${ALG_TOTEMS.find(t=>t.id===parentId).name}+${ALG_TOTEMS.find(t=>t.id===litChildren[i]).name}+${ALG_TOTEMS.find(t=>t.id===litChildren[j]).name}`);
         }else{
           normalRules++;
           algLog(`🔹 法则：${ALG_TOTEMS.find(t=>t.id===parentId).name}+${ALG_TOTEMS.find(t=>t.id===litChildren[i]).name}+${ALG_TOTEMS.find(t=>t.id===litChildren[j]).name}`);
         }
       }
     }
   }
 }
 let name='—',desc='尚未形成有效组合',cls='r-fail',rewardKey='失败';
 if(truths>=2||goldRules>=2){
   name='🌟 奇迹炼成';desc='2个真理 或 2个黄金法则 — 最高品质';cls='r-qiji';rewardKey='奇迹';
   algStats.truth+=truths;algStats.gold+=goldRules;
 }else if((truths>=1&&(normalRules+goldRules)>=1)||(normalRules>=2)){
   name='💎 大师炼成';desc='1真理+1法则 或 2个相同普通法则';cls='r-dashi';rewardKey='大师';
   algStats.truth+=truths;algStats.rule+=normalRules;
 }else if(truths>=1){
   name='⭐ 杰出炼成';desc='1个真理';cls='r-jiechu';rewardKey='杰出';
   algStats.truth+=truths;
 }else if(normalRules>=2||goldRules>=2){
   name='🔷 稀有炼成';desc=goldRules>=2?'2个黄金法则':'2个不同法则';cls='r-xiyou';rewardKey='稀有';
   algStats.rule+=normalRules+goldRules;
 }else if(normalRules>=1||goldRules>=1){
   name='🔹 普通炼成';desc=goldRules>=1?'1个黄金法则':'1个法则';cls='r-putong';rewardKey='普通';
   algStats.rule+=normalRules+goldRules;
 }
 document.getElementById('alg-rname').textContent=name;
 document.getElementById('alg-rname').className='rn '+cls;
 document.getElementById('alg-rdesc').textContent=desc;

 const rewards=ALG_REWARDS[rewardKey]||ALG_REWARDS['失败'];
 document.getElementById('reward-name').textContent=rewards[0].name;
 document.getElementById('reward-desc').textContent=rewards[0].desc;
 let listHtml=rewards.map((r,i)=>`<div style="font-size:11px;color:${i===0?'#62e4a1':'#8aa8c4'};padding:2px 0">${i+1}. ${r.name} — ${r.desc}</div>`).join('');
 document.getElementById('reward-list').innerHTML=listHtml;
 algUpdateStats();
}
function algLog(msg){
 const log=document.getElementById('alg-log');if(!log)return;
 const d=document.createElement('div');d.className='alg-log-item';d.textContent=msg;
 log.prepend(d);if(log.children.length>30)log.removeChild(log.lastChild);
}
function algReveal(){
 if(algRevealed){
   const cost = Math.pow(2,algRevealCount)*10;
   algLog(`⚠️ 启示已使用过，本次消耗 ${cost} 空灵棱锥 + ${cost/2} 魔晶`);
 }
 algRevealCount++;
 algRevealed=true;
 document.getElementById('btn-reveal').disabled=true;
 algSageProgress=Math.min(algSageProgress+1,360);
 document.getElementById('sage-text').textContent=algSageProgress+'/360';
 document.getElementById('sage-bar').style.width=(algSageProgress/360*100)+'%';
 const unlit=ALG_TOTEMS.filter(t=>!algState[t.id].lit);
 if(unlit.length>0){
   const pick=unlit[Math.floor(Math.random()*unlit.length)];
   algState[pick.id].lit=true;algState[pick.id].count=1;
   algLog('💡 启示点亮：'+pick.name);algRender();
 }else algLog('💡 所有律已点亮');
}
function algDeny(){
 const lit=ALG_TOTEMS.filter(t=>algState[t.id].lit);
 if(lit.length===0){algLog('⚠️ 没有可否定的律');return;}
 const pick=lit[Math.floor(Math.random()*lit.length)];
 algState[pick.id].lit=false;algState[pick.id].count=0;
 algLog('❌ 否定：抹除 '+pick.name);
 algRender();
}
function algWait(){
 algLog('⏳ 等待炼成（次日4点随机启示1个律）');
 const unlit=ALG_TOTEMS.filter(t=>!algState[t.id].lit);
 if(unlit.length>0){
   const pick=unlit[Math.floor(Math.random()*unlit.length)];
   algState[pick.id].lit=true;algState[pick.id].count=1;algRender();
 }
 setTimeout(()=>{
   algEvaluate();
   const rn=document.getElementById('alg-rname').textContent;
   const rw=document.getElementById('reward-name').textContent;
   algLog(`✅ 炼成完成：${rn} → 推荐奖励：${rw}`);
 },500);
}
function algUpdateStats(){
 const a=document.getElementById('s-truth');if(a)a.textContent=algStats.truth;
 const b=document.getElementById('s-rule');if(b)b.textContent=algStats.rule;
 const c=document.getElementById('s-gold');if(c)c.textContent=algStats.gold;
 const d=document.getElementById('s-count');if(d)d.textContent=algStats.count;
}

/* ========== 炼丹模拟 ========== */
function renderDanYao(){
 let groups = Object.keys(DANYAO_RECIPES).map(k=>{
   let rows = DANYAO_RECIPES[k].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");
   return `<div class=panel><b>${k}</b>${tableHTML(["丹药","配方/火候","效果"],DANYAO_RECIPES[k])}</div>`;
 }).join("");
 app.innerHTML=`<div class=title>🔥 贝雅大陆炼丹配方大全（全等级·全丹方·火候指南）</div>${groups}
 <div class=note>炼丹需要建造炼丹炉，放入3-10个药材。五行相生增加属性值，相克增加失败概率。火候值在炼制过程中会自动减少，持续时间最长的档位为最终火候。内丹等级需通过服用对应等级丹药获取经验来提升。材料主要从地火深渊、都广之野、熔火之窟等地底区域采集。</div>`;
}

/* ========== 搜索 ========== */
function search(){let q=document.querySelector("#q").value.trim().toLowerCase();if(!q){go("首页");return}
 let hits=[];
 const all=[...mounts,...freePets,...bossPets,...freePlay,...exchange];
 all.forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push(x)});
 feedRecipes.forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push(["饲料",x[1],x[2]+" · "+x[3]])});
 foodRecipes.forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push(["食物",x[1],x[2]+" · "+x[3]])});
 ingredientList.forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push(["食材",x[1],x[2]+" · "+x[3]])});
 materialList.forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push(["物资",x[0],x[1]])});
 POINTS.forEach(p=>{if((p.name+p.pos+p.note).toLowerCase().includes(q))hits.push(["地图",p.name,p.pos+" · "+p.coords])});
 Object.keys(DANYAO_RECIPES).forEach(k=>{
   DANYAO_RECIPES[k].forEach(r=>{
     if(r.join(" ").toLowerCase().includes(q))hits.push(["丹方",r[0],r[1]+" · "+r[2]]);
   });
 });
 WEAPON_RECIPES.forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push(["武器",x[0],x[3]+" · "+x[4]])});
 TREASURE_HINTS.forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push(["藏宝图",x[0],x[1]||'—',x[3]])});
 app.innerHTML=`<div class=title>🔎 搜索：${q}</div>`+(hits.length?`<div class=grid>${hits.map(x=>`<div class=card><div class=tag>${x[0]}</div><div class=big>${x[1]}</div><div class=muted>${x[2]}</div></div>`).join("")}</div>`:`<div class=panel>没有找到相关内容</div>`);
}

drawNav();render();
</script>

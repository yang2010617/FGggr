<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创造与魔法 · 刷新计时助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101d;color:#edf6ff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
:root{--c:#66d9ff;--g:#62e4a1;--card:#101d2e;--line:#23364e;--muted:#91a5bd;--red:#ff6b6b;--orange:#ffa726;--purple:#ba68c8}
.wrap{max-width:900px;margin:auto;padding:14px}

/* 登录页 */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:linear-gradient(180deg,#13243a,#0d1929);border:1px solid var(--line);border-radius:20px;padding:30px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
.login-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.login-input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#06101b;color:#fff;font-size:15px;margin-bottom:12px}
.login-input:focus{outline:none;border-color:var(--c)}
.login-btn{width:100%;padding:12px;border-radius:11px;border:0;background:var(--c);color:#06111c;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}
.login-btn.admin{background:var(--purple);color:#fff;margin-top:8px}
.login-error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:20px}
.login-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}

/* 主界面 */
header{padding:14px;background:linear-gradient(135deg,#0c2943,#091522);border-bottom:1px solid var(--line)}
.header-top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:20px}
.user-info{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.user-tag{padding:3px 8px;border-radius:6px;background:#17405a;color:#66d9ff;font-size:11px}
.user-tag.admin{background:#3d2757;color:#d4a5ff}
.logout-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer}

nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#cbd9e9;cursor:pointer;font-size:13px}
.tab.on{background:#17405a;color:white;border-color:#56c8ef}

.title{font-size:18px;font-weight:800;margin:14px 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:14px}

/* 分类筛选 */
.cat-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#0d1929;color:#cbd9e9;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}
.cat-btn.on{background:#17405a;border-color:#56c8ef;color:white}
.cat-btn .count{background:#1a2e47;padding:2px 7px;border-radius:8px;font-size:11px;color:var(--muted)}
.cat-btn.on .count{background:#0c2943;color:#66d9ff}

/* 搜索 */
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-bar input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#06101b;color:#fff;font-size:14px}

/* 计时项 */
.timer-list{display:grid;gap:10px}
.timer-item{background:#0d1929;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.timer-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.timer-info{flex:1;min-width:0}
.timer-name{font-weight:700;font-size:15px;margin-bottom:3px}
.timer-desc{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.timer-desc span{white-space:nowrap}
.timer-right{text-align:right;flex-shrink:0}
.timer-countdown{font-size:18px;font-weight:800;font-family:monospace}
.timer-countdown.ready{color:var(--g);animation:pulse 1s infinite}
.timer-countdown.warning{color:var(--orange)}
.timer-countdown.danger{color:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.timer-btn{margin-top:6px;padding:5px 12px;border-radius:7px;border:0;font-size:12px;font-weight:700;cursor:pointer}
.timer-btn.start{background:var(--g);color:#062c1b}
.timer-btn.reset{background:var(--red);color:#fff}
.timer-btn.add{background:var(--c);color:#06111c}

/* 空状态 */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

/* 管理员面板 */
.admin-panel{background:linear-gradient(180deg,#1a1030,#0d0a1a);border:1px solid #3d2757}
.admin-title{color:#d4a5ff;font-weight:800;margin-bottom:12px;font-size:16px}
.user-list{display:grid;gap:8px}
.user-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#1a1030;border-radius:9px;border:1px solid #3d2757}
.user-item .name{font-weight:700}
.user-item .role{font-size:11px;padding:2px 6px;border-radius:5px;background:#2d1b47;color:#d4a5ff}
.user-item .del-btn{background:none;border:1px solid #5c3a7a;color:#ff8080;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.add-user{display:flex;gap:8px;margin-top:12px}
.add-user input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid #3d2757;background:#0d0a1a;color:#fff;font-size:13px}
.add-user select{padding:9px 12px;border-radius:8px;border:1px solid #3d2757;background:#0d0a1a;color:#fff;font-size:13px}
.add-user button{padding:9px 16px;border-radius:8px;border:0;background:var(--purple);color:#fff;font-weight:700;cursor:pointer;font-size:13px}

/* 统计栏 */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat-num{font-size:20px;font-weight:800}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.stat-num.ready{color:var(--g)}
.stat-num.total{color:var(--c)}

/* 标记颜色 */
.cat-boss{background:#e040fb22;color:#e040fb}
.cat-mount{background:#4fc3f722;color:#4fc3f7}
.cat-elite{background:#ff980022;color:#ffb74d}
.cat-plant{background:#66bb6a22;color:#66bb6a}
.cat-ore{background:#ffa72622;color:#ffa726}
.cat-box{background:#ffcf5c22;color:#ffcf5c}

footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0}

@media(max-width:500px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .timer-countdown{font-size:15px}
}
</style>

  return localStorage.getItem('currentUser') || '';

// 时间格式化
function formatTimeLeft(ms){
  if(ms <= 0) return '已刷新 ✅';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if(d > 0) return `${d}天 ${h}时 ${m}分`;
  if(h > 0) return `${h}时 ${m}分 ${sec}秒`;
  if(m > 0) return `${m}分 ${sec}秒`;
  return `${sec}秒`;
}

function getTimeStatus(ms, totalMs){
  if(ms <= 0) return 'ready';
  if(ms < totalMs * 0.1) return 'danger';
  if(ms < totalMs * 0.3) return 'warning';
  return '';
}

// ========== 登录逻辑 ==========
function doLogin(){
  const user = $('loginUser').value.trim();
  const pass = $('loginPass').value;
  $('loginError').textContent = '';
  
  if(!user || !pass){
    $('loginError').textContent = '请输入用户名和密码';
    return;
  }
  
  // 检查用户列表
  const users = JSON.parse(localStorage.getItem('users') || '{}');
  
  // 如果没有任何用户，第一个注册的就是管理员
  if(Object.keys(users).length === 0){
    users[user] = { password: pass, role: 'admin', created: Date.now() };
    localStorage.setItem('users', JSON.stringify(users));
    localStorage.setItem('currentUser', user);
    localStorage.setItem('isAdmin', 'true');
    enterApp(user, true);
    return;
  }
  
  // 验证用户
  if(users[user] && users[user].password === pass){
    localStorage.setItem('currentUser', user);
    localStorage.setItem('isAdmin', users[user].role === 'admin' ? 'true' : 'false');
    enterApp(user, users[user].role === 'admin');
  } else {
    $('loginError').textContent = '用户名或密码错误';
  }
}

function doAdminLogin(){
  const user = $('loginUser').value.trim();
  const pass = $('loginPass').value;
  $('loginError').textContent = '';
  
  if(!user || !pass){
    $('loginError').textContent = '请输入管理员账号和密码';
    return;
  }
  
  const users = JSON.parse(localStorage.getItem('users') || '{}');
  
  // 超级管理员密码：如果输入特定密码，直接创建管理员
  if(pass === 'qwertyuiopQWE12349178' && !users[user]){
    users[user] = { password: pass, role: 'admin', created: Date.now() };
    localStorage.setItem('users', JSON.stringify(users));
    localStorage.setItem('currentUser', user);
    localStorage.setItem('isAdmin', 'true');
    enterApp(user, true);
    return;
  }
  
  // 验证管理员
  if(users[user] && users[user].password === pass && users[user].role === 'admin'){
    localStorage.setItem('currentUser', user);
    localStorage.setItem('isAdmin', 'true');
    enterApp(user, true);
  } else {
    $('loginError').textContent = '管理员账号或密码错误';
  }
}

function doLogout(){
  localStorage.removeItem('currentUser');
  localStorage.removeItem('isAdmin');
  location.reload();
}

function enterApp(user, isAdmin){
  $('loginPage').style.display = 'none';
  $('app').style.display = 'block';
  $('userName').textContent = user;
  $('userRoleTag').textContent = isAdmin ? '管理员' : '用户';
  $('userRoleTag').className = 'user-tag' + (isAdmin ? ' admin' : '');
  
  // 重新生成tab
  const tabList = ['刷新计时', '藏宝图', '炼丹模拟', '饲料配方', '食物配方', '饮品配方', '食材配料', '我的记录', '数据大全'];
  if(isAdmin) tabList.push('管理后台');
  const nav = $('nav');
  nav.innerHTML = tabList.map(t => 
    `<div class="tab${t===currentTab?' on':''}" onclick="switchTab('${t}')">${t}</div>`
  ).join('');
  
  render();
  startTimer();
}

// ========== 计时记录存储 ==========
function getUserRecordsKey(){
  return 'records_' + getCurrentUser();
}

function getRecords(){
  return JSON.parse(localStorage.getItem(getUserRecordsKey()) || '{}');
}

function saveRecords(records){
  localStorage.setItem(getUserRecordsKey(), JSON.stringify(records));
}

function startTimerRecord(itemName, refreshHours){
  const records = getRecords();
  records[itemName] = {
    startTime: Date.now(),
    durationMs: refreshHours * 60 * 60 * 1000,
    itemName: itemName
  };
  saveRecords(records);
  render();
}

function resetTimerRecord(itemName){
  const records = getRecords();
  delete records[itemName];
  saveRecords(records);
  render();
}

// ========== 渲染 ==========
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('on', el.textContent === tab);
  });
  render();
}

function switchCat(cat){
  currentCat = cat;
  render();
}

function doSearch(q){
  searchQ = q;
  render();
}

function render(){
  const main = $('mainContent');
  
  if(currentTab === '刷新计时'){
    renderTimerPage(main);
  } else if(currentTab === '我的记录'){
    renderRecordsPage(main);
  } else if(currentTab === '藏宝图'){
    renderTreasurePage();
  } else if(currentTab === '炼丹模拟'){
    renderDanYao();
  } else if(currentTab === '饲料配方'){
    renderFeedPage();
  } else if(currentTab === '食物配方'){
    renderFoodPage();
  } else if(currentTab === '饮品配方'){
    renderDrinksPage();
  } else if(currentTab === '食材配料'){
    renderIngredientPage();
  } else if(currentTab === '数据大全'){
    renderDataPage(main);
  } else if(currentTab === '管理后台'){
    renderAdminPage(main);
  }
}

function renderTimerPage(main){
  const records = getRecords();
  const recordEntries = Object.entries(records);
  
  // 统计
  const total = recordEntries.length;
  const ready = recordEntries.filter(([_, r]) => Date.now() >= r.startTime + r.durationMs).length;
  const inProgress = total - ready;
  
  let html = `
    <div class="title">⏱️ 刷新计时</div>
    
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-num total">${total}</div><div class="stat-label">总计</div></div>
      <div class="stat-card"><div class="stat-num">${inProgress}</div><div class="stat-label">刷新中</div></div>
      <div class="stat-card"><div class="stat-num ready">${ready}</div><div class="stat-label">已刷新</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--purple)">${TIMER_ITEMS.length}</div><div class="stat-label">数据总数</div></div>
    </div>
    
    <div class="search-bar">
      <input placeholder="搜索：骨龙、飞龙、云鸟、独角兽、龙草…" oninput="doSearch(this.value)">
    </div>
    
    <div class="cat-bar">
      ${CATEGORIES.map(cat => {
        const count = cat.id === 'all' ? TIMER_ITEMS.length : TIMER_ITEMS.filter(i => i.category === cat.id).length;
        return `<button class="cat-btn${currentCat===cat.id?' on':''}" onclick="switchCat('${cat.id}')">
          ${cat.icon} ${cat.name} <span class="count">${count}</span>
        </button>`;
      }).join('')}
    </div>
  `;
  
  // 筛选
  let items = TIMER_ITEMS;
  if(currentCat !== 'all'){
    items = items.filter(i => i.category === currentCat);
  }
  if(searchQ){
    const q = searchQ.toLowerCase();
    items = items.filter(i => 
      i.name.toLowerCase().includes(q) || 
      (i.feed||'').toLowerCase().includes(q) ||
      (i.note||'').toLowerCase().includes(q)
    );
  }
  
  if(items.length === 0){
    html += `<div class="panel empty">没有找到相关数据</div>`;
  } else {
    html += `<div class="timer-list">`;
    
    items.forEach(item => {
      const record = records[item.name];
      const catInfo = CATEGORIES.find(c => c.id === item.category) || {};
      
      let timeText = item.refresh;
      let timeStatus = '';
      let btnHtml = '';
      
      if(record){
        const now = Date.now();
        const elapsed = now - record.startTime;
        const left = record.durationMs - elapsed;
        timeText = formatTimeLeft(left);
        timeStatus = getTimeStatus(left, record.durationMs);
        btnHtml = `<button class="timer-btn reset" onclick="resetTimerRecord('${item.name}')">重置</button>`;
      } else {
        btnHtml = `<button class="timer-btn start" onclick="startTimerRecord('${item.name}', ${item.refresh_hours})">开始计时</button>`;
      }
      
      html += `
        <div class="timer-item">
          <div class="timer-icon ${catInfo.color}">${catInfo.icon}</div>
          <div class="timer-info">
            <div class="timer-name">${item.name}</div>
            <div class="timer-desc">
              <span>⏰ ${item.refresh}</span>
              ${item.level ? `<span>📍 ${item.level}</span>` : ''}
              ${item.type ? `<span>🏷️ ${item.type}</span>` : ''}

function renderRecordsPage(main){
  const records = getRecords();
  const entries = Object.entries(records);
  
  // 按剩余时间排序
  entries.sort((a, b) => {
    const aLeft = a[1].durationMs - (Date.now() - a[1].startTime);
    const bLeft = b[1].durationMs - (Date.now() - b[1].startTime);
    return aLeft - bLeft;
  });
  
  let html = `<div class="title">📋 我的记录</div>`;
  
  if(entries.length === 0){
    html += `<div class="panel empty">还没有计时记录<br><br>去「刷新计时」页面开始计时吧！</div>`;
  } else {
    html += `<div class="panel">
      <div style="margin-bottom:10px;font-size:14px;color:var(--muted)">
        共 ${entries.length} 条记录 · 关闭页面后继续计时
      </div>
      <div class="timer-list">`;
    
    entries.forEach(([name, record]) => {
      const now = Date.now();
      const left = record.durationMs - (now - record.startTime);
      const status = getTimeStatus(left, record.durationMs);
      const item = TIMER_ITEMS.find(i => i.name === name);
      const catInfo = item ? CATEGORIES.find(c => c.id === item.category) : {};
      
      html += `
        <div class="timer-item">
          <div class="timer-icon ${catInfo.color||''}">${catInfo.icon||'⏱️'}</div>
          <div class="timer-info">
            <div class="timer-name">${name}</div>
            <div class="timer-desc">
              <span>总时长：${(record.durationMs/3600000).toFixed(1)}小时</span>
            </div>
          </div>
          <div class="timer-right">
            <div class="timer-countdown ${status}">${formatTimeLeft(left)}</div>
            <button class="timer-btn reset" onclick="resetTimerRecord('${name}')">删除</button>
          </div>
        </div>
      `;
    });
    
    html += `</div></div>`;
  }
  
  main.innerHTML = html;
}

function renderDataPage(main){

        return `<button class="cat-btn${currentCat===cat.id?' on':''}" onclick="switchCat('${cat.id}');render()">
          ${cat.icon} ${cat.name} <span class="count">${count}</span>
        </button>`;
      }).join('')}
    </div>
  `;

    items = items.filter(i => i.category === currentCat);
  }
  if(searchQ){
    const q = searchQ.toLowerCase();
    items = items.filter(i => 
      i.name.toLowerCase().includes(q) || 
      (i.feed||'').toLowerCase().includes(q) ||
      (i.note||'').toLowerCase().includes(q)
    );
  }
  
  html += `<div class="timer-list">`;
  items.forEach(item => {
    const catInfo = CATEGORIES.find(c => c.id === item.category) || {};

          ${item.note ? `<div class="timer-desc" style="margin-top:4px;color:var(--muted)">💡 ${item.note}</div>` : ''}

// ========== 表格工具 ==========
function tableHTML(headers, rows){
  return `<table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead><tr>${headers.map(h=>`<th style="padding:8px;text-align:left;background:#0d1929;border-bottom:1px solid #23364e;color:#66d9ff">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,i)=>`<tr style="${i%2?'background:#0a1628':''}">${r.map(c=>`<td style="padding:7px;border-bottom:1px solid #1a2a40;vertical-align:top;line-height:1.5">${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

function tableWrap(content){
  return `<div style="overflow-x:auto">${content}</div>`;
}

function deleteUser(name){
  if(!confirm('确定删除用户 ' + name + ' 吗？')) return;
  const users = JSON.parse(localStorage.getItem('users') || '{}');
  delete users[name];
  localStorage.setItem('users', JSON.stringify(users));
  // 同时删除该用户的记录
  localStorage.removeItem('records_' + name);
  render();
}

function addUser(){
  const name = $('newUser').value.trim();
  const pass = $('newPass').value;
  const role = $('newRole').value;
  
  if(!name || !pass){
    alert('请输入用户名和密码');
    return;
  }
  
  const users = JSON.parse(localStorage.getItem('users') || '{}');
  if(users[name]){
    alert('用户名已存在');
    return;
  }
  
  users[name] = { password: pass, role: role, created: Date.now() };
  localStorage.setItem('users', JSON.stringify(users));
  
  $('newUser').value = '';
  $('newPass').value = '';
  render();
  alert('添加成功！');
}

// ========== 定时器 ==========
function startTimer(){
  if(timer) clearInterval(timer);
  timer = setInterval(() => {
    // 只在刷新计时和我的记录页面刷新
    if(currentTab === '刷新计时' || currentTab === '我的记录' || currentTab === '数据大全'){
      // 只更新倒计时数字，不重绘整个页面
      updateCountdowns();
    }
  }, 1000);
}

function updateCountdowns(){
  const records = getRecords();
  document.querySelectorAll('.timer-countdown').forEach(el => {
    // 找到对应item
    const item = el.closest('.timer-item');
    if(!item) return;
    const name = item.querySelector('.timer-name').textContent;
    const record = records[name];
    if(record){
      const now = Date.now();
      const left = record.durationMs - (now - record.startTime);
      el.textContent = formatTimeLeft(left);
      el.className = 'timer-countdown ' + getTimeStatus(left, record.durationMs);
    }
  });
}
